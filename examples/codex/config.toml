# Simtrail's tools for OpenAI Codex: add this to ~/.codex/config.toml.
[mcp_servers.simtrail]
command = "uvx"
args = ["--from", "git+https://github.com/Soflutionltd/simtrail", "simtrail", "mcp"]
# To pin a project rather than use the folder Codex starts in, append its scope and root:
# args = ["--from", "git+https://github.com/Soflutionltd/simtrail", "simtrail", "mcp",
#         "--scope", "my-app", "--root", "/Users/me/Projects/my-app"]

# A build or a test run can take minutes; Simtrail bounds each tool itself.
tool_timeout_sec = 900
